<title>Snap Into Existance Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a field codex. Sticky header with search, a row of chapter tabs, one chapter at a time,
   and a side sheet that opens on any item, job or building so everything links to everything. */
:root{
  --bg:#eceff7; --surface:#ffffff; --surface-2:#e2e6f2; --ink:#151a34; --muted:#565d80; --line:#cbd1e4;
  --accent:#c42d76; --accent-ink:#ffffff; --gold:#956600; --good:#23874a; --bad:#c23244;
  --r-common:#69718a; --r-uncommon:#2c8a2a; --r-rare:#1d6ad4; --r-epic:#7840d0; --r-legendary:#9f6c00; --r-mythic:#c81e5f; --r-secret:#0e8f7e; --r-unknown:#cf1f2e;
  --shadow:0 18px 50px rgba(20,26,60,.18);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0e21; --surface:#141a38; --surface-2:#1d244b; --ink:#eef0fb; --muted:#a0a7cb; --line:#2c3566;
  --accent:#ff70b8; --accent-ink:#1b0a16; --gold:#ffcb52; --good:#6fd894; --bad:#ff7a88;
  --r-common:#c6ccd9; --r-uncommon:#7fd36f; --r-rare:#66abff; --r-epic:#bb8dff; --r-legendary:#ffcf4a; --r-mythic:#ff6a9d; --r-secret:#2ee6c8; --r-unknown:#ff4a58;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b0e21; --surface:#141a38; --surface-2:#1d244b; --ink:#eef0fb; --muted:#a0a7cb; --line:#2c3566;
  --accent:#ff70b8; --accent-ink:#1b0a16; --gold:#ffcb52; --good:#6fd894; --bad:#ff7a88;
  --r-common:#c6ccd9; --r-uncommon:#7fd36f; --r-rare:#66abff; --r-epic:#bb8dff; --r-legendary:#ffcf4a; --r-mythic:#ff6a9d; --r-secret:#2ee6c8; --r-unknown:#ff4a58;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.9rem}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.toprow{display:flex;gap:16px;align-items:center;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:1.45rem;white-space:nowrap}
.brand .ver{font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.snapmark{width:30px;height:30px;flex:none}
.search{position:relative;flex:1 1 280px;min-width:0}
.search input{width:100%;font:inherit;font-weight:600;padding:10px 14px 10px 38px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:min(60vh,440px);overflow:auto;padding:6px}
.results button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer}
.results button:hover,.results button.on{background:var(--surface-2)}
.results .kind{margin-left:auto;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.results .none{padding:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:thin}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.86rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main{padding-block:28px 64px}
section.chapter{display:grid;gap:22px}
.lede{max-width:68ch;font-size:1.04rem}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.head{display:grid;gap:8px}

/* rarity gem */
.gem{display:inline-block;width:.62em;height:.62em;transform:rotate(45deg);border-radius:2px;background:var(--rc,var(--r-common));flex:none;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--rc) 35%,transparent)}
.r-Common{--rc:var(--r-common)}.r-Uncommon{--rc:var(--r-uncommon)}.r-Rare{--rc:var(--r-rare)}.r-Epic{--rc:var(--r-epic)}.r-Legendary{--rc:var(--r-legendary)}.r-Mythic{--rc:var(--r-mythic)}.r-Secret{--rc:var(--r-secret)}.r-Unknown{--rc:var(--r-unknown)}
.rtext{color:var(--rc);font-weight:800}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:2px 10px;font-size:.84rem;font-weight:700;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.chip .q{color:var(--muted);font-weight:800}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .flab{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 11px;font-weight:800;font-size:.84rem;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* grids of tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--rc,var(--accent));transform:translateY(-1px)}
.tile .nm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1rem}
.tile .sub{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.count{font-size:.86rem;color:var(--muted);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.cols > *{min-width:0}
.stack{display:grid;gap:10px}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.dots{margin:0;padding-left:1.1em;display:grid;gap:4px}

/* the loop */
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:step}
.loop li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;counter-increment:step;position:relative}
.loop li::before{content:counter(step);font-family:var(--display);font-size:1.6rem;color:var(--accent);line-height:1}
.loop b{font-size:1rem}
.loop span{font-size:.86rem;color:var(--muted)}
.loop ol{margin:0;padding:0;display:contents}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}

/* snap lab */
.ladder{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.ladder div{background:var(--rc);min-width:2px;transition:flex-basis .35s ease}
.ladderkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem}
.ladderkey span{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.lab{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.lab{grid-template-columns:1fr}}
.ctrl{display:grid;gap:12px}
.ctrl label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
.ctrl .row{display:flex;justify-content:space-between;gap:10px}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:.9rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.bigluck{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,25,.45);z-index:40}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;gap:18px;align-content:start;animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ladder div{transition:none}.tile:hover{transform:none}}
.sheet .x{justify-self:end;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 12px;font-weight:800;cursor:pointer}
.sheet h2{display:flex;align-items:center;gap:12px;font-size:1.8rem}
.sheet h2 .gem{width:.5em;height:.5em}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.sheet .blk{display:grid;gap:8px}
.sheet .blk > h3{font-size:.76rem;font-family:var(--body);font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.how{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.recipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.recipe .arrow{color:var(--muted);font-weight:800}
.recipe .where{flex-basis:100%;font-size:.8rem;color:var(--muted)}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:var(--surface);border-radius:0 10px 10px 0;font-size:.9rem}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;font-weight:700;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;background:var(--surface);white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cal{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cal div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;text-align:center}
.cal div b{font-family:var(--display);font-size:1.05rem;font-weight:400}
.cal div.big{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal small{color:var(--muted);font-size:.78rem}
.crown{color:var(--gold);font-weight:800}
.gemtxt{color:#4fb2ff;font-weight:800}
.soon{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);border:1px solid currentColor;border-radius:999px;padding:0 7px}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:.86rem}
</style>

JOBS.forEach(([job,rarity])=>ITEM[job+" Job"]={name:job+" Job",rarity,cat:"Job",job});
const ALL_ITEMS = Object.values(ITEM);
const JOB = {}; JOBS.forEach(([job,rarity,desc,station])=>JOB[job]={job,rarity,desc,station,rolled:true});
SPECIAL_JOBS.forEach(([job,desc])=>JOB[job]={job,desc,rolled:false});
const BLD = {}; BUILD.forEach(b=>BLD[b.id]=b);
const BLD_BY_NAME = {}; BUILD.forEach(b=>BLD_BY_NAME[b.name]=b);
const GATHERED_BY = {}; for (const [job,list] of Object.entries(GATHERS)) for (const r of list) (GATHERED_BY[r]=GATHERED_BY[r]||[]).push(job);
const ROLLABLE = ALL_ITEMS.filter(i=>i.cat!=="Goods");
const LIMIT = {"Legendary": 5, "Mythic": 3, "Secret": 2, "Unknown": 1};
const WHEN = {"meteor": "during a Meteor Shower", "night": "at night", "snow": "while it snows", "rain": "while it rains", "storm": "in a thunderstorm or heavy rain", "visitor": "while a friend is visiting", "citizens50": "once your town has 50 citizens", "day100": "from day 100 on"};
const ROLL_WHEN = {"Stardust": "meteor", "Ghostwood": "night", "Eclipse Stone": "snow", "Rainbow Quartz": "rain", "Kraken Ink": "storm", "Snap Egg": "visitor", "Ghost Lantern": "night", "Crown of the First King": "citizens50", "Timekeeper Job": "day100", "Ghost Keeper Job": "night"};
const HIGH = r=>["Legendary","Mythic","Secret","Unknown"].includes(r);
const RCOUNT = {}; ROLLABLE.forEach(i=>RCOUNT[i.rarity]=(RCOUNT[i.rarity]||0)+1);

const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n=>{ if(n>=100) return Math.round(n).toLocaleString(); if(n>=10) return n.toFixed(1).replace(/\.0$/,""); return n.toFixed(2).replace(/0$/,"").replace(/\.0$/,""); };
const time = s=>{ s=Math.ceil(s); if(s>=3600){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+"h"+(m?" "+m+"m":"");} if(s>=60){const m=Math.floor(s/60),r=s%60;return m+" min"+(r?" "+r+"s":"");} return s+"s"; };
const sellOf = name=>{ if(SELL[name]!=null) return SELL[name]; const i=ITEM[name]; return i&&["Material","Food","Goods"].includes(i.cat)?RAW[i.rarity]:0; };

function luckWeights(L){ const w={}; let t=0; RAR.forEach((r,i)=>{w[r]=WEIGHT[r]*(i>0?L:1); t+=w[r];}); return {w,t}; }
function chance(name,L=1){ const i=ITEM[name]; if(!i||i.cat==="Goods") return 0; const {w,t}=luckWeights(L); return w[i.rarity]/t/RCOUNT[i.rarity]; }

/* links */
const itemChip = (name,q)=>{ const i=ITEM[name]; const r=i?i.rarity:"Common"; return `<button class="chip r-${r}" data-open="item:${esc(name)}"><i class="gem"></i>${q!=null?`<span class="q num">${q}</span>`:""}${esc(name)}</button>`; };
const jobChip = j=>{ const J=JOB[j]; return `<button class="chip ${J&&J.rarity?"r-"+J.rarity:""}" data-open="job:${esc(j)}">${J&&J.rarity?'<i class="gem"></i>':""}${esc(j)}</button>`; };
const bldChip = id=>{ const b=BLD[id]; return b?`<button class="chip" data-open="bld:${id}">${esc(b.name)}</button>`:""; };
const costSpans = c=>Object.keys(c).map(n=>{const i=ITEM[n];return `<span class="chip ${i?"r-"+i.rarity:""}">${i?'<i class="gem"></i>':""}<span class="q num">${c[n]}</span>${esc(n)}</span>`;}).join("");
const costChips = c=>{ const k=Object.keys(c); return k.length?k.map(n=>ITEM[n]?itemChip(n,c[n]):`<span class="chip"><span class="q num">${c[n]}</span>${esc(n)}</span>`).join(""):'<span class="chip">Free</span>'; };

function upCost(b,lv){ if(b.hall) return HALL[lv]; if(lv===1) return {...b.cost}; const mul=lv===2?.6:1, c={}; for(const[k,v] of Object.entries(b.cost)) c[k]=Math.max(1,Math.ceil(v*mul)); if(lv===2) c.Planks=(c.Planks||0)+6+(b.foot||1)*2; else {c.Bricks=(c.Bricks||0)+8+(b.foot||1)*3; c.Tools=(c.Tools||0)+1;} return c; }
function buildTime(b,lv){ if(b.hall) return HALL_TIME[lv]; const base=Math.max(5,Math.floor((b.work||20)*1.25+.5)); return lv===1?base:lv===2?base*8:base*40; }

/* ============================================================ "how to get" + "used for" */
function howToGet(name){
  const i=ITEM[name], out=[];
  if(!i) return out;
  if(i.cat==="Material"||i.cat==="Food"){
    const who=(GATHERED_BY[name]||["Gatherer"]);
    out.push(`<b>Roll it with Snap</b> to learn it. Rolling teaches your citizens where to find it; it doesn't hand you a pile.`);
    out.push(`<b>Then your ${who.map(j=>jobChip(j)).join(" ")} collect it</b>${PLACE[name]?` from ${PLACE[name]}`:""}. Give citizens that job in People.`);
    out.push(`<b>Roll it again</b> to raise its mastery (up to level 5). Each level brings back more per trip.`);
    if(HIGH(i.rarity)) out.push(`<b>Its source is out in the world.</b> They turn up as you explore${PLACE[name]?": "+esc(PLACE[name]):""}. When you roll it and your land has none yet, one appears for you.`);
    if(["Common","Uncommon","Rare"].includes(i.rarity)) out.push(`<b>Already fully mastered?</b> Rolling it again gives you a pile of it instead: ${({Common:15,Uncommon:10,Rare:5})[i.rarity]}.`);
    if(ROLL_WHEN[name]) out.push(`<b>Only rolls ${esc(WHEN[ROLL_WHEN[name]])}.</b>`);
    if(name==="Wood"||name==="Stone") out.push(`Your first five Snaps are always Miner Job, Gatherer Job, Stone, Wood and Builder Job, so you start with this one.`);
    if(name==="Glass") out.push(`Or craft it: ${recipeInline(RECIPES.find(r=>r.out==="Glass"))}`);
    const bonus = {Wood:"Lumber Mill: +2 Wood every trip.",Stone:"Quarry: +1 per trip.",Clay:"Quarry: +1 per trip.","Iron Ore":"Quarry: +1 per trip.",Fish:"Fishing Hut: +2 Fish.",Meat:"Hunting Lodge: +1 per trip.",Hide:"Hunting Lodge: +1 per trip."}[name];
    if(bonus) out.push(`<b>Boost it:</b> ${bonus}`);
    if(i.food) out.push(`<b>Boost it:</b> a Bakery adds +1 to every food trip, and Autumn adds +1 more.`);
  } else if(i.cat==="Goods"){
    const rs=RECIPES.filter(r=>r.out===name);
    out.push(`<b>Crafted, never rolled.</b> A worker walks to a workplace, uses the inputs and makes the output. Needs the job unlocked and the building built.`);
    if(name==="Planks"||name==="Cut Stone") out.push(`<b>Queue it first.</b> ${esc(name)} is only made when you order it, so your ${name==="Planks"?"Wood":"Stone"} is saved for building. Open the Bag, tap ${esc(name)} and pick +10, +50, +100 or +250.`);
    rs.forEach(r=>out.push(recipeInline(r)));
    if(["Planks","Bread","Stone"].includes(name)) {}
    const reward = {Planks:"Also from login rewards (days 3 and 7) and the Roll weekly goal.",Bread:"Also from the day 7 login reward."}[name];
    if(reward) out.push(reward);
  } else if(i.cat==="Job"){
    out.push(`<b>Roll it with Snap.</b> It's ${i.rarity}: about ${pct(chance(name))} per Snap at base luck.`);
    out.push(`Once unlocked, open People and give any adult citizen the ${esc(i.job)} job.`);
    if(LIMIT[i.rarity]) out.push(`<b>Limited:</b> only ${LIMIT[i.rarity]===1?"1 citizen":LIMIT[i.rarity]+" citizens"} can have it at a time.`);
    if(ROLL_WHEN[name]) out.push(`<b>Only rolls ${esc(WHEN[ROLL_WHEN[name]])}.</b>`);
    if(i.job==="Miner"||i.job==="Gatherer"||i.job==="Builder") out.push(`One of your guaranteed first five Snaps.`);
  } else if(i.cat==="Special"){
    out.push(`<b>Roll it with Snap.</b> ${i.rarity}: about ${pct(chance(name))} per Snap at base luck, ${oneIn(chance(name))}.`);
    if(ROLL_WHEN[name]) out.push(`<b>Only rolls ${esc(WHEN[ROLL_WHEN[name]])}.</b>`);
  }
  return out;
}
function recipeInline(r){ return `<span class="recipe">${Object.entries(r.inp).map(([k,v])=>itemChip(k,v)).join("")}<span class="arrow">→</span>${itemChip(r.out,r.n)}<span class="where">${jobChip(r.job)} at ${r.at.map(bldChip).join(" or ")}</span></span>`; }
function usedFor(name){
  const uses=[];
  const rs=RECIPES.filter(r=>r.inp[name]);
  if(rs.length) uses.push({h:"Crafting",html:rs.map(recipeInline).join("")});
  const bs=BUILD.filter(b=>b.cost[name]);
  const ds=DECOR.filter(d=>d[2][name]).map(d=>d[0]).concat(PATHS.filter(p=>p[1][name]).map(p=>p[0])).concat(FURN.filter(f=>f[2][name]).map(f=>f[0]));
  if(bs.length) uses.push({h:"Building",html:`<div class="chips">${bs.map(b=>bldChip(b.id)).join("")}</div>`});
  if(ds.length) uses.push({h:"Decorations, paths and furniture",html:`<div class="chips">${ds.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div>`});
  const up={Planks:"Every level II building upgrade needs Planks.",Bricks:"Every level III building upgrade needs Bricks.",Tools:"Every level III building upgrade needs 1 Tools. Town Hall II needs 3."}[name];
  const hall=[2,3].filter(l=>HALL[l][name]).map(l=>"Town Hall "+["","I","II","III"][l]);
  if(up||hall.length) uses.push({h:"Upgrades",html:`<p>${up?up+" ":""}${hall.length?`Also: ${hall.join(", ")}.`:""}</p>`});
  const war={Weapons:"Quick militia in the War Room: 25 Coins + 1 Weapons. Recruits need Weapons to finish training. The Armory's Iron Sword and Steel Halberd need Weapons too.",Leather:"Armory: Leather Armor (12) and the Recurve Bow (8).","Iron Bar":"Armory: Iron Sword, Steel Halberd, Starsteel Blade, Crossbow and Chainmail.",Gears:"Armory: the Crossbow (10).",Gold:"Armory: Plate Armor (4).","Starsteel Bar":"Armory: the Starsteel Blade (4).",Arrows:"War Room: Archery Drills. Armory: Longbow (30) and Recurve Bow (60).","Copper Bar":"War Room: Watch Bells.",Armor:"War Room: Soldier Armor. Armory: Chainmail (6) and Plate Armor (14)."}[name];
  if(war) uses.push({h:"War Room",html:`<p>${war}</p>`});
  const i=ITEM[name];
  if(i&&i.food) uses.push({h:"Food",html:`<p>Citizens eat it, and couples need 4 food for a baby. Granaries hold +200 more food.</p>`});
  if(name==="Medicine") uses.push({h:"Health",html:`<p>With Medicine in stock, everyone works 20% faster ("HEALTHY +20%").</p>`});
  if(name==="Herbs") {}
  return uses;
}
const pct = p=>p>=.1?(p*100).toFixed(1)+"%":p>=.01?(p*100).toFixed(2)+"%":(p*100).toFixed(3)+"%";
const oneIn = p=>p>0?"about 1 in "+Math.round(1/p).toLocaleString():"";

/* ============================================================ chapters */
const CH = [
 ["start","Start here"],["snap","The Snap"],["items","Items"],["jobs","Jobs"],["crafting","Crafting"],["buildings","Buildings"],
 ["town","Town & Money"],["army","Army"],["life","Citizen life"],["world","World"],["visiting","Visiting"],["rewards","Rewards"],["shop","Shop"],["controls","Controls"],
];

function render(){
  tabsEl.innerHTML = CH.map(([id,n])=>`<button role="tab" id="tab-${id}" aria-selected="${state.ch===id}" data-ch="${id}">${n}</button>`).join("");

  if(state.ch==="snap") wireLab();
}

  <div class="note">Long chains pay best. Charters sell for 9 Coins each and need Manuscripts plus Trade Goods, which need Pottery, which needs Clay.</div>`; },

buildings(){
  const subs=["Housing","Production","Crafting","Community","Defense","Special","Wonders","Decorations","Paths","Terrain","Furniture"];
  let body="";
  if(["Decorations","Paths","Terrain","Furniture"].includes(state.bSub)){
    if(state.bSub==="Decorations") body=`<p class="muted">Decorations make the town nicer to live in. Trees you plant can be used by Gatherers.</p><div class="grid">${DECOR.map(([n,s,c,d])=>`<div class="tile" style="cursor:default"><span class="nm">${esc(n)}</span><span class="sub">${esc(s)} · ${esc(d)}</span><div class="chips">${costChips(c)}</div></div>`).join("")}</div>`;
    if(state.bSub==="Paths") body=`<p class="muted">Paths are drawn one tile at a time. Bridges can cross water.</p><div class="grid">${PATHS.map(([n,c,d])=>`<div class="tile" style="cursor:default"><span class="nm">${esc(n)}</span><span class="sub">${esc(d)}</span><div class="chips">${costChips(c)}</div></div>`).join("")}</div>`;
    if(state.bSub==="Terrain") body=`<p class="muted">Terrain tools are free. They're in the Build menu under Terrain.</p><div class="grid">${TERRAIN.map(([n,d])=>`<div class="tile" style="cursor:default"><span class="nm">${esc(n)}</span><span class="sub">${esc(d)}</span></div>`).join("")}</div>`;
    if(state.bSub==="Furniture") body=`<p class="muted">Furniture goes inside buildings: tap a building, then Look inside. Beds are what let citizens move in.</p><div class="grid">${FURN.map(([n,s,c,d,sl])=>`<div class="tile" style="cursor:default"><span class="nm">${esc(n)}${sl?` <span class="chip">sleeps ${sl}</span>`:""}</span><span class="sub">${esc(s)} · ${esc(d)}</span><div class="chips">${costChips(c)}</div></div>`).join("")}</div>`;
  } else {
    const list=BUILD.filter(b=>b.sub===state.bSub);
    body=`<div class="grid">${list.map(b=>`<button class="tile" data-open="bld:${b.id}"><span class="nm">${esc(b.name)}</span><span class="sub">${esc(b.desc)}</span><div class="chips">${costSpans(b.cost)}</div></button>`).join("")}</div>`;
  }
  return `${head("Buildings","What to build",`Place things from the Build menu. Builders walk to each site and put it up. Buildings go up to level III. Tap a building to see what it does and what each upgrade costs.`)}
  <div class="filters">${subs.map(s=>`<button data-bsub="${s}" aria-pressed="${state.bSub===s}">${s}</button>`).join("")}</div>
  ${body}
  <div class="note">Construction keeps going while you're offline. In a hurry? Finish any build early for 1 Gem per minute left.</div>`; },

town(){
  const sells=Object.entries(SELL).sort((a,b)=>b[1]-a[1]);
  return `${head("Town & Money","Running the colony",`Power, people, storage and money. These are the numbers behind your town.`)}
  <div class="cols">
   <div class="panel stack"><h3>Power</h3><p>Power (0 to 100%) is how strong your world feels. It raises your Snap luck: full power alone makes luck x3.</p>
    <div class="tablewrap"><table><tbody>
     <tr><td>Each home</td><td class="r num">+1 to +6 (its size)</td></tr><tr><td>Snap Obelisk</td><td class="r num">+6</td></tr><tr><td>Tavern</td><td class="r num">+4</td></tr>
     <tr><td>Plaza Fountain, Town Hall</td><td class="r num">+3</td></tr><tr><td>Well, Market Stall</td><td class="r num">+2</td></tr>
     <tr><td>Shed, Storehouse, Granary, Kitchen, Forge, Kiln, Infirmary</td><td class="r num">+1</td></tr>
     <tr><td>New Citizen (roll)</td><td class="r num">+3 each</td></tr><tr><td>Snap Crystal (roll)</td><td class="r num">+10</td></tr>
    </tbody></table></div></div>
   <div class="panel stack"><h3>Population</h3><ul class="dots">
    <li>You start with room for 4 citizens. The Town Hall adds +2, +3 and +4 at levels I to III, and a Nursery adds +2.</li>
    <li>Every citizen needs a bed. Homes give room; furniture beds let people move in.</li>
    <li>Couples have a baby when there's a free bed and 4 food. A baby takes 30 minutes to arrive.</li>
    <li>Babies grow into children, then adults. A School makes them grow up 50% faster.</li>
    <li>Citizens have birthdays (+5 Coins party), make best friends and grow old.</li></ul></div>
   <div class="panel stack"><h3>Storage</h3><ul class="dots">
    <li>Every resource holds 150 to start.</li><li>Storage Shed +50, Storehouse +150 (for every resource).</li>
    <li>Granary +200 for food only.</li><li>Town Hall +50 / +100 / +150 by level.</li>
    <li>Starter Pack: +300 for every resource, for good.</li>
    <li>Gamepasses: 5x Storage, or Infinite Storage.</li></ul></div>
  </div>
  <div class="cols">
   <div class="panel stack"><h3><span class="crown">Coins</span>: earning</h3><ul class="dots">
    <li><b>Work</b>: every load a gatherer brings back +0.1, every batch a crafter finishes +0.3, Builders earn a little while they build.</li>
    <li><b>Meals and drinks</b>: a citizen eating from the stores pays 1. Breakfast or lunch at a Tavern, Bakery or Kitchen pays 2, an Ale at the Tavern 3 (a hot cider 1). Market, Music Hall and Trading House visits pay 1.</li>
    <li><b>Taxes</b>, every minute, per adult: 0.1 at the camp, then 0.25 / 0.5 / 0.75 with Town Hall I / II / III.</li>
    <li><b>Selling</b> goods from the Bag. Each Market Stall adds +10%, up to +50%.</li>
    <li><b>Events</b>: catch a golden animal (+30), sell to the traveling merchant, birthdays (+5).</li>
    <li><b>Caves</b> (visitors and helpers), rewards, goals and badges.</li></ul></div>
   <div class="panel stack"><h3><span class="crown">Coins</span>: spending</h3><ul class="dots">
    <li>War Room upgrades, training at the Barracks and the Armory (see the Army chapter).</li>
    <li>The traveling merchant's offers.</li></ul></div>
   <div class="panel stack"><h3><span class="gemtxt">Gems</span></h3><ul class="dots">
    <li>Bought in the Shop with Robux (25 / 50 / 100 / 250). A new world starts with 35.</li>
    <li>The old Crowns became Gems one for one when GAV43 came out.</li>
    <li>Finish construction or an upgrade right now: 1 Gem per minute left.</li>
    <li>Trade for Coins in the Shop: 1 Gem = 5 Coins.</li></ul></div>
  </div>
  <h3>Sell prices (Coins each, before Market bonus)</h3>
  <div class="tablewrap"><table><thead><tr><th>Good</th><th class="r">Coins</th><th>Good</th><th class="r">Coins</th></tr></thead><tbody>
   ${Array.from({length:Math.ceil(sells.length/2)},(_,i)=>{const a=sells[i],b=sells[i+Math.ceil(sells.length/2)];return `<tr><td>${itemChip(a[0])}</td><td class="r num crown">${fmt(a[1])}</td><td>${b?itemChip(b[0]):""}</td><td class="r num crown">${b?fmt(b[1]):""}</td></tr>`;}).join("")}
  </tbody></table></div>
  <p class="muted">Raw materials and food sell by rarity: Common 0.08, Uncommon 0.2, Rare 0.6, Epic 1.5.</p>
  <h3>War Room</h3>
  <p class="muted lede">Opens with the Town Hall. Spend Coins on offense and defense for the threats to come. Some levels need a higher Town Hall or extra goods.</p>
  <div class="tablewrap"><table><thead><tr><th>Upgrade</th><th>Side</th><th>Does</th><th>Coins per level</th><th>Town Hall needed</th><th>Extra goods</th></tr></thead><tbody>
   ${MILITARY.map(([n,s,d,c,h,g])=>`<tr><td><b>${n}</b></td><td>${s}</td><td>${d}</td><td class="num crown">${c.join(" / ")}</td><td class="num">${h.map(x=>["","I","II","III"][x]).join(" / ")}</td><td>${g?g.join(" / "):"—"}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="note">Soldiers and archers are trained at the ${bld("barracks")}. Ranks, patrols and the Armory are in the ${link("army","Army")} chapter. Every Town Hall level adds +10 Defense.</div>`; },

army(){ const U=ARMY.units, roman=["","I","II","III"], hrs=t=>t?(t/3600)+" h":"—";
  const unitRows=line=>U.filter(u=>u.line===line).map(u=>`<tr><td><b>${u.name}</b>${u.tier?` <span class="muted">tier ${roman[u.tier]}</span>`:""}</td><td class="num">${u.atk}</td><td class="num">${u.def}</td><td class="num crown">${u.coins?fmt(u.coins):"—"}</td><td class="num">${hrs(u.time)}</td><td class="num">${u.level?roman[u.level]:"—"}</td><td>${u.desc}</td></tr>`).join("");
  const goods=g=>g?Object.entries(g).map(([k,v])=>itemChip(k,v)).join(" "):"—";
  const arms=`<div class="tablewrap"><table><thead><tr><th>Track</th><th>Tier</th><th class="r">Coins</th><th>Goods</th><th class="r">Town Hall</th><th>Does</th></tr></thead><tbody>${ARMY.arms.map(a=>a.tiers.map((t,i)=>`<tr><td>${i===0?`<b>${a.name}</b><br><span class="muted">${a.line==="all"?"every unit":a.line==="soldier"?"soldiers":"archers"}</span>`:""}</td><td><b>${t.name}</b>${i===0?' <span class="muted">(start)</span>':""}</td><td class="r num crown">${t.coins?fmt(t.coins):"—"}</td><td>${goods(t.goods)}</td><td class="r num">${t.hall?roman[t.hall]:"—"}</td><td>${t.desc}</td></tr>`).join("")).join("")}</tbody></table></div>`;
  return `${head("Army","Soldiers, archers and the Armory",`Build a ${bld("barracks")}, click it and press Train. Training costs Coins and takes real time, even while you're offline. Your army then guards the town on its own, using every wall, gate and tower you've built.`)}
  <h3>Soldiers</h3>
  <p class="muted lede">${ARMY.lines[0].desc}</p>
  <div class="tablewrap"><table><thead><tr><th>Rank</th><th>Attack</th><th>Defense</th><th>Coins</th><th>Training</th><th>Barracks</th><th>About</th></tr></thead><tbody>${unitRows("soldier")}</tbody></table></div>
  <h3>Archers</h3>
  <p class="muted lede">${ARMY.lines[1].desc}</p>
  <div class="tablewrap"><table><thead><tr><th>Rank</th><th>Attack</th><th>Defense</th><th>Coins</th><th>Training</th><th>Barracks</th><th>About</th></tr></thead><tbody>${unitRows("archer")}</tbody></table></div>
  <div class="cols">
   <div class="panel stack" style="align-content:start"><h3>Training</h3><ul class="dots">
    <li>Each Barracks has ${ARMY.slots.join(" / ")} training spots at level I / II / III. More Barracks add more spots.</li>
    <li>Pick who trains with the arrows on each card. Unassigned citizens and Recruits go first, then soldiers of a lower rank in the same line (a promotion), then other workers. Limited Legendary-and-up jobs are never picked.</li>
    <li>Trainees take the Recruit job and practice at the Barracks: swordwork, or target shooting for archers.</li>
    <li>Finish now with Gems (1 per minute left), or Stop to get every Coin back. Giving a trainee another job also stops their training and refunds it.</li>
   </ul></div>
   <div class="panel stack" style="align-content:start"><h3>Militia</h3><ul class="dots">
    <li>The old ways still work: give a citizen the Recruit job (2 minutes, needs Weapons), or use Quick militia in the War Room (25 Coins + 1 Weapons).</li>
    <li>Both make Militia: 5 Attack, 2 Defense, always with a spear. Militia can train up to any soldier or archer rank later.</li>
    <li>A Paladin counts as four Militia.</li>
   </ul></div>
   <div class="panel stack" style="align-content:start"><h3>Patrols</h3><ul class="dots">
    <li>Archers climb watchtowers first (one each), then Castle Gates (three each) and castle walls (${bld("watchtower")} ${bld("castlegate")} ${bld("castlewall")}), keep watch over the merlons and take aim now and then. Every 10 minutes they move along one post.</li>
    <li>Soldiers stand guard either side of each Castle Gate, outside, and walk the inside of your walls and palisades.</li>
    <li>No walls? They patrol the streets and the ring round town. Knights and Rangers also guard the Town Hall door.</li>
    <li>With castle walls, a Castle Gate or a watchtower built, archers defend twice as well.</li>
   </ul></div>
  </div>
  <h3>The Armory</h3>
  <p class="muted lede">In the War Room. Each track upgrades your whole army at once, and the new gear shows up on them straight away.</p>
  ${arms}
  <div class="note">The War Room's older upgrades (Iron Spearheads, Soldier Armor and the rest) still add to every unit. Attack and defense get you ready for the enemies coming in a future update.</div>`; },

life(){ return `${head("Citizen life","Every citizen has a day of their own",`Citizens follow the town clock: breakfast, work or school, lunch, an evening out and bed. What they do depends on their personality and on which buildings your town has.`)}
  <div class="cols">
   <div class="panel stack"><h3>Personalities</h3><p class="muted">Shown on each citizen's card. Every citizen has one for life.</p><div class="tablewrap"><table><tbody>
    <tr><td><b>Early bird</b></td><td>Never misses breakfast</td></tr>
    <tr><td><b>Social butterfly</b></td><td>Almost every evening at the Tavern with friends</td></tr>
    <tr><td><b>Homebody</b></td><td>Heads home early to relax</td></tr>

    <tr><td><b>Foodie</b></td><td>Breakfast and lunch out, every day</td></tr>
    <tr><td><b>Devout</b></td><td>Evenings at the Chapel, Snap Shrine or Obelisk</td></tr>
    <tr><td><b>Curious</b></td><td>Music Hall, Academy, Market and the fountain</td></tr>
   </tbody></table></div></div>
   <div class="panel stack"><h3>A day in town</h3><div class="tablewrap"><table><tbody>
    <tr><td class="num">4:12</td><td>Wake up</td></tr>

    <tr><td class="num">7:00 to 14:00</td><td>Children at ${bld("school")}, an Elder teaching</td></tr>

  </div>
  <div class="cols">

   <div class="panel stack"><h3>School</h3><ul class="dots">

    <li>A School also still makes children grow up 50% faster.</li></ul></div>
   <div class="panel stack"><h3>Indoor workers</h3><ul class="dots">
    <li>Cooks, Crafters, Smiths, Healers, Masons and the other workshop jobs stay inside their workplace between jobs, instead of wandering around town.</li>
    <li>They still pop out for breakfast or lunch and go home at night.</li></ul></div>
  </div>`; },

  <div class="panel stack"><h3>Biomes (${BIOMES.length})</h3><div class="chips">${BIOMES.map(b=>`<span class="chip">${b}</span>`).join("")}</div><p class="muted">Discovering every biome is tracked in the Explored card at the top right.</p></div>

controls(){ return `${head("Controls","PC and mobile",`Turn on Draggable panels in Options to move any panel. Panels always stay on screen. Reset panels puts them back.`)}

    <tr><td>Build</td><td><kbd>N</kbd></td></tr><tr><td>Bag</td><td><kbd>B</kbd></td></tr><tr><td>People</td><td><kbd>C</kbd></td></tr>
    <tr><td>Map</td><td><kbd>M</kbd></td></tr><tr><td>Fly home</td><td><kbd>H</kbd></td></tr><tr><td>War Room</td><td><kbd>K</kbd></td></tr>
    <tr><td>Shop</td><td><kbd>P</kbd></td></tr><tr><td>Rewards</td><td><kbd>G</kbd></td></tr><tr><td>Options</td><td><kbd>O</kbd></td></tr>
    <tr><td>Turn a building while placing</td><td><kbd>R</kbd></td></tr><tr><td>Terrain height / brush</td><td><kbd>-</kbd> <kbd>=</kbd> / <kbd>[</kbd> <kbd>]</kbd></td></tr>
    <tr><td>Use a helper tool (visiting)</td><td><kbd>E</kbd> or click</td></tr>
   </tbody></table></div></div>
   <div class="panel stack"><h3>Mobile</h3><ul class="dots">
    <li><b>Default</b>: one finger drags the camera, pinch to zoom, twist two fingers to turn, slide two fingers up or down to tilt. The arrow buttons in the corner turn and tilt too.</li>
    <li><b>Camera thumbstick</b> (Options): the stick moves the camera and a swipe with your other thumb turns it, like normal Roblox controls.</li>
    <li><b>Building</b>: tap where to put it, then PLACE, TURN or DONE.</li>
    <li>The arrows on the resource bar and the dock tuck them away to free up the screen.</li></ul></div>
  </div>`; },
};
const link=(ch,t)=>`<a href="#${ch}" data-go="${ch}">${t}</a>`;
const bld=id=>`<button class="chip" data-open="bld:${id}">${esc(BLD[id].name)}</button>`;
function tileSub(i){
  if(i.cat==="Material"||i.cat==="Food") return (GATHERED_BY[i.name]||["Gatherer"]).join(", ")+"s collect it";
  if(i.cat==="Goods"){ const r=RECIPES.find(r=>r.out===i.name); return "Made by "+r.job+"s"; }
  if(i.cat==="Job") return "Unlocks the "+i.job+" job";
  return i.note;
}

/* ============================================================ snap lab */
function wireLab(){
  const L=state.luck, $=id=>document.getElementById(id);
  $("lPower").value=L.power; $("lShrines").value=L.shrines; $("lCrystals").value=L.crystals; $("lPass").checked=L.pass; $("lHour").checked=L.hour; $("lMeteor").checked=L.meteor;
  const upd=()=>{
    L.power=+$("lPower").value; L.shrines=+$("lShrines").value; L.crystals=+$("lCrystals").value; L.pass=$("lPass").checked; L.hour=$("lHour").checked; L.meteor=$("lMeteor").checked;
    $("lPowerV").textContent=L.power+"%"; $("lShrinesV").textContent=L.shrines; $("lCrystalsV").textContent=L.crystals;
    const base=1+L.power/50+L.shrines*.2+L.crystals*.25, luck=base*(L.pass?4:1)*(L.hour?2:1)*(L.meteor?1.5:1);
    $("luckOut").textContent="x"+luck.toFixed(2);
    $("luckWhy").textContent=`Base ${base.toFixed(2)}`+(L.pass?" × 4 pass":"")+(L.hour?" × 2 Lucky Hour":"")+(L.meteor?" × 1.5 meteors":"")+". A new world starts at 5% power: x1.10.";
    const {w,t}=luckWeights(luck);
    document.querySelectorAll("#ladder div").forEach(d=>d.style.flexBasis=(w[d.dataset.r]/t*100)+"%");
    $("oddsBody").innerHTML=RAR.map(r=>{const p=w[r]/t, each=p/RCOUNT[r]; return `<tr class="click" data-irar-go="${r}"><td><span class="r-${r} rtext"><i class="gem"></i> ${r}</span></td><td class="r num">${RCOUNT[r]}</td><td class="r num">${pct(p)}</td><td class="r num">${pct(each)} <span class="muted">(1 in ${Math.round(1/each).toLocaleString()})</span></td></tr>`;}).join("");
  };
  ["lPower","lShrines","lCrystals","lPass","lHour","lMeteor"].forEach(id=>$(id).addEventListener("input",upd));
  upd();
}

/* ============================================================ detail sheet */
const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
let lastFocus=null;
function openSheet(key){
  const [kind,...rest]=key.split(":"), id=rest.join(":");
  let html="";
  if(kind==="item"){
    const i=ITEM[id]; if(!i) return;
    const kindLabel={Material:"Material",Food:"Food",Goods:i.food?"Crafted food":"Crafted good",Special:"Special roll",Job:"Job unlock"}[i.cat];
    const sv=sellOf(id);
    html=`<h2 id="sheetTitle" class="r-${i.rarity}"><i class="gem"></i>${esc(id)}</h2>
     <div class="meta"><span class="chip r-${i.rarity}"><span class="rtext">${i.rarity}</span></span><span class="chip">${kindLabel}</span>${i.cat!=="Goods"?`<span class="chip num">${pct(chance(id))} per Snap</span>`:""}${sv?`<span class="chip num"><span class="crown">${fmt(sv)}</span>&nbsp;Coins each</span>`:""}</div>
     ${i.note&&i.note!=="food"?`<p class="lede">${esc(i.note)}</p>`:""}
     <div class="blk"><h3>How to get it</h3><ul class="how">${howToGet(id).map(h=>`<li>${h}</li>`).join("")}</ul></div>
     ${i.cat==="Job"?`<div class="blk"><h3>The job</h3><p>${esc(JOB[i.job].desc)}</p><div class="chips">${jobChip(i.job)}</div></div>`:""}
     ${usedFor(id).map(u=>`<div class="blk"><h3>Used for: ${u.h}</h3>${u.html}</div>`).join("")}`;
  } else if(kind==="job"){
    const J=JOB[id]; if(!J) return;
    const gathers=GATHERS[id], makes=RECIPES.filter(r=>r.job===id), st=J.station;
    const places=[...new Set(makes.flatMap(r=>r.at))];
    html=`<h2 id="sheetTitle" class="${J.rarity?"r-"+J.rarity:""}">${J.rarity?'<i class="gem"></i>':""}${esc(id)}</h2>
     <div class="meta">${J.rarity?`<span class="chip r-${J.rarity}"><span class="rtext">${J.rarity}</span></span><span class="chip num">${pct(chance(id+" Job"))} per Snap</span>`:'<span class="chip">Not rolled</span>'}</div>
     <p class="lede">${esc(J.desc)}</p>
     <div class="blk"><h3>How to unlock</h3><p>${J.rolled?`Roll ${itemChip(id+" Job")} with Snap, then give it to an adult in People.`:esc(J.desc)}</p>${J.rolled&&ROLL_WHEN[id+" Job"]?`<p><b>Only rolls ${esc(WHEN[ROLL_WHEN[id+" Job"]])}.</b></p>`:""}${J.rolled&&LIMIT[J.rarity]?`<p><b>Limited:</b> only ${LIMIT[J.rarity]===1?"1 citizen":LIMIT[J.rarity]+" citizens"} can have this job at a time.</p>`:""}${BUILD.find(b=>b.needsJob===id)?`<p>Unlocks the ${bldChip(BUILD.find(b=>b.needsJob===id).id)} Wonder in the Build menu.</p>`:""}</div>
     ${gathers?`<div class="blk"><h3>Collects (once learned)</h3><div class="chips">${gathers.map(n=>itemChip(n)).join("")}</div></div>`:""}
     ${makes.length?`<div class="blk"><h3>Makes</h3>${makes.map(recipeInline).join("")}</div>`:""}
     ${places.length?`<div class="blk"><h3>Works at</h3><div class="chips">${places.map(bldChip).join("")}</div></div>`:""}
     ${id==="Builder"?`<div class="blk"><h3>Tips</h3><p>More Builders means more sites going up at once. A site only counts down while a Builder is standing at it.</p></div>`:""}
     ${id==="Explorer"?`<div class="blk"><h3>Tips</h3><p>Explorers only head into fog next to land you've already explored.</p></div>`:""}`;
  } else if(kind==="bld"){
    const b=BLD[id]; if(!b) return;
    const makes=RECIPES.filter(r=>r.at.includes(id));
    const canUp=!b.noUp;
    html=`<h2 id="sheetTitle" class="${b.rarity?"r-"+b.rarity:""}">${b.rarity?'<i class="gem"></i>':""}${esc(b.name)}</h2>
     <div class="meta">${b.rarity?`<span class="chip r-${b.rarity}"><span class="rtext">${b.rarity}</span></span>`:""}${b.needsJob?jobChip(b.needsJob):""}<span class="chip">${b.sub}</span>${b.foot?`<span class="chip num">${b.foot}×${b.foot} tiles</span>`:""}${b.home?`<span class="chip num">${b.home} home${b.home>1?"s":""}</span>`:""}${b.interior?`<span class="chip">Has an inside</span>`:""}</div>
     <p class="lede">${esc(b.desc)}</p>
     <div class="blk"><h3>${b.hall?"Costs (upgrade the camp)":"Costs"}</h3><div class="chips">${costChips(b.cost)}</div><p class="muted">Takes ${time(buildTime(b,1))} to build.</p></div>
     ${makes.length?`<div class="blk"><h3>Workers make here</h3>${makes.map(recipeInline).join("")}</div>`:""}
     ${b.station&&!makes.length?`<div class="blk"><h3>Workers</h3><div class="chips">${jobChip(b.station)}</div></div>`:""}
     ${canUp?`<div class="blk"><h3>Upgrades</h3><div class="tablewrap"><table><thead><tr><th>Level</th><th>Costs</th><th class="r">Time</th></tr></thead><tbody>${[2,3].map(l=>`<tr><td><b>${["","I","II","III"][l]}</b></td><td><div class="chips">${costChips(upCost(b,l))}</div></td><td class="r num">${time(buildTime(b,l))}</td></tr>`).join("")}</tbody></table></div>
       <p class="muted">${b.hall?`Each level: +${HALL_STORE[2]} / +${HALL_STORE[3]} storage, more taxes, more room for citizens (+${HALL_CAP[2]} / +${HALL_CAP[3]}), stronger defenses.`:upText(b)} Finish early for 1 Gem per minute left.</p></div>`:`<div class="blk"><h3>Upgrades</h3><p class="muted">Walls and palisades don't have levels.</p></div>`}`;
  }
  sheet.innerHTML=`<button class="x" id="sheetClose">Close</button>${html}`;
  if(sheet.hidden) lastFocus=document.activeElement;
  sheet.hidden=false; scrim.hidden=false; sheet.scrollTop=0;
  document.getElementById("sheetClose").focus();
}
function upText(b){ const t=[]; if(b.home) t.push(`+${b.home} home each level`); if(b.interior) t.push("bigger rooms"); if(b.storage) t.push(`+${b.storage} storage`); if(b.foodStorage) t.push(`+${b.foodStorage} food storage`); if(b.station) t.push(`${b.station}s make +1 more each time`); if(b.id==="barracks") t.push("+1 training spot, unlocks tier II and III ranks, Recruits train 50% faster"); return t.length?"Each level: "+t.join(", ")+".":"Each level makes it bigger and fancier."; }
function closeSheet(){ sheet.hidden=true; scrim.hidden=true; lastFocus&&lastFocus.focus&&lastFocus.focus(); }
scrim.addEventListener("click",closeSheet);

/* ============================================================ search */
const q=document.getElementById("q"), res=document.getElementById("results");
const INDEX=[
 ...ALL_ITEMS.map(i=>({t:i.name,k:i.cat==="Job"?"Job unlock":i.cat==="Goods"?"Crafted":i.cat,r:i.rarity,key:"item:"+i.name})),
 ...Object.keys(JOB).map(j=>({t:j,k:"Job",r:JOB[j].rarity,key:"job:"+j})),
 ...BUILD.map(b=>({t:b.name,k:"Building",key:"bld:"+b.id})),
 ...CH.map(([id,n])=>({t:n,k:"Chapter",go:id})),
 ...[["Likes","visiting"],["Helpers","visiting"],["War Room","town"],["Barracks training","army"],["Armory","army"],["Patrols","army"],["Knight","army"],["Ranger","army"],["Militia","army"],["Taxes","town"],["Power","town"],["Babies","town"],["Storage","town"],["Seasons","world"],["Biomes","world"],["Meteor shower","world"],["Luck","snap"],["Gamepasses","shop"],["Login rewards","rewards"],["Badges","rewards"],["Leaderboards","rewards"],["Furniture","buildings"],["Terrain tools","buildings"],["Paths","buildings"],["Decorations","buildings"],["Thumbstick","controls"],["Keyboard shortcuts","controls"]].map(([t,g])=>({t,k:"Topic",go:g})),
];
let sel=0, hits=[];
function doSearch(){
  const s=q.value.trim().toLowerCase();
  if(!s){res.hidden=true;return;}
  hits=INDEX.map(e=>{const t=e.t.toLowerCase(); const sc=t===s?0:t.startsWith(s)?1:t.includes(s)?2:9; return [sc,e];}).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].t.localeCompare(b[1].t)).slice(0,12).map(x=>x[1]);
  sel=0;
  res.innerHTML=hits.length?hits.map((h,i)=>`<button data-hit="${i}" class="${i===0?"on":""}">${h.r?`<i class="gem r-${h.r}"></i>`:""}<span>${esc(h.t)}</span><span class="kind">${h.k}</span></button>`).join(""):`<div class="none">Nothing called “${esc(q.value)}”. Try a shorter word.</div>`;
  res.hidden=false;
}
function pick(h){ res.hidden=true; q.value=""; if(h.go) go(h.go); else openSheet(h.key); }
q.addEventListener("input",doSearch);
q.addEventListener("keydown",e=>{
  if(res.hidden) return;
  const btns=res.querySelectorAll("button");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!btns.length) return; btns[sel].classList.remove("on"); sel=(sel+(e.key==="ArrowDown"?1:-1)+btns.length)%btns.length; btns[sel].classList.add("on"); btns[sel].scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"&&hits[sel]){ e.preventDefault(); pick(hits[sel]); }
  else if(e.key==="Escape"){ res.hidden=true; }
});
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) res.hidden=true; });

/* ============================================================ clicks */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-open],[data-ch],[data-go],[data-icat],[data-irar],[data-bsub],[data-hit],[data-irar-go],#sheetClose");
  if(!t) return;
  if(t.id==="sheetClose") return closeSheet();
  if(t.dataset.hit!=null) return pick(hits[+t.dataset.hit]);
  if(t.dataset.open) return openSheet(t.dataset.open);
  if(t.dataset.ch) return go(t.dataset.ch);
  if(t.dataset.go){ e.preventDefault(); closeSheet(); return go(t.dataset.go); }
  if(t.dataset.icat){ state.itemCat=t.dataset.icat; return render(); }
  if(t.dataset.irar){ state.itemRar=t.dataset.irar; return render(); }
  if(t.dataset.irarGo){ state.itemRar=t.dataset.irarGo; state.itemCat="All"; return go("items"); }
  if(t.dataset.bsub){ state.bSub=t.dataset.bsub; return render(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!sheet.hidden) closeSheet();
  if(e.key==="/"&&document.activeElement!==q&&!e.target.closest("input")){ e.preventDefault(); q.focus(); }
});
tabsEl.addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return;
  const i=CH.findIndex(c=>c[0]===state.ch); const n=CH[(i+(e.key==="ArrowRight"?1:-1)+CH.length)%CH.length][0];
  go(n); document.getElementById("tab-"+n).focus();
});
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h&&h!==state.ch) go(h,false); });

/* boot */
(function(){ let start=location.hash.slice(1); if(!VIEWS[start]){ try{start=localStorage.getItem("codex.ch")||"start"}catch(e){start="start"} } state.ch=VIEWS[start]?start:"start"; render(); })();
</script>
